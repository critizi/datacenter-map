<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Datacenter Map</title>
<meta name="description" content="Interactive 3D globe of the world's data centers — capacity, status, build timelines." />
<style>:root {
  --bg: #0a0e14;
  --panel: #11161f;
  --panel-2: #161c27;
  --border: #232a37;
  --text: #e6edf3;
  --text-dim: #8b97a8;
  --accent: #4cc2ff;
  --green: #3fb950;
  --yellow: #f0b429;
  --blue: #4cc2ff;
  --red: #f85149;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

#globe-container {
  position: absolute;
  inset: 0;
}

.topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  background: linear-gradient(180deg, rgba(10,14,20,0.9) 0%, rgba(10,14,20,0) 100%);
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }

.brand {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.3px;
  margin-right: 8px;
}
.brand .accent { color: var(--accent); }

.kpi-strip {
  display: flex;
  gap: 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 12px;
}
.kpi-strip .kpi { display: flex; gap: 6px; align-items: baseline; }
.kpi-strip .kpi .v { font-weight: 600; color: var(--text); }
.kpi-strip .kpi .l { color: var(--text-dim); }

.search-box {
  flex: 1;
  max-width: 320px;
  margin-left: auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.search-box:focus { border-color: var(--accent); }

.filters {
  position: absolute;
  top: 70px;
  left: 20px;
  z-index: 10;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 12px;
  min-width: 200px;
}
.filters h4 {
  margin: 0 0 8px 0;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-dim);
}
.filters .group { margin-bottom: 12px; }
.filters .group:last-child { margin-bottom: 0; }
.filters label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  cursor: pointer;
  user-select: none;
}
.filters label:hover { color: var(--accent); }
.filters input[type="checkbox"] { accent-color: var(--accent); }
.filters .dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
}

.detail-panel {
  position: absolute;
  top: 0; right: 0;
  width: 420px;
  height: 100%;
  background: var(--panel);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 200ms ease-out;
  z-index: 20;
  overflow-y: auto;
}
.detail-panel.open { transform: translateX(0); }

.detail-panel .close {
  position: absolute; top: 10px; right: 14px;
  background: transparent; border: 0; color: var(--text-dim);
  font-size: 22px; cursor: pointer;
}
.detail-panel .close:hover { color: var(--text); }

.detail-panel .hero {
  width: 100%;
  height: 200px;
  background: var(--panel-2);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim);
  font-size: 12px;
  background-size: cover;
  background-position: center;
}

.detail-panel .body { padding: 18px 22px; }
.detail-panel h2 { margin: 0 0 4px 0; font-size: 18px; }
.detail-panel .subtitle { color: var(--text-dim); font-size: 12px; margin-bottom: 16px; }
.detail-panel .badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.badge.operational { background: rgba(63,185,80,0.15); color: var(--green); }
.badge.under_construction { background: rgba(240,180,41,0.15); color: var(--yellow); }
.badge.planned { background: rgba(76,194,255,0.15); color: var(--blue); }
.badge.retired { background: rgba(248,81,73,0.15); color: var(--red); }

.detail-panel .row {
  display: flex; justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.detail-panel .row .k { color: var(--text-dim); }
.detail-panel .row .v { color: var(--text); text-align: right; max-width: 60%; }

.detail-panel .section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-dim);
  margin: 18px 0 8px;
}

.capacity-gauge {
  background: var(--panel-2);
  border-radius: 6px;
  padding: 12px;
  margin-top: 6px;
}
.capacity-gauge .mw {
  font-size: 26px;
  font-weight: 600;
  color: var(--accent);
}
.capacity-gauge .label { font-size: 11px; color: var(--text-dim); }

.timeline {
  background: var(--panel-2);
  border-radius: 6px;
  padding: 12px;
  margin-top: 6px;
  font-size: 12px;
}
.timeline .step {
  display: flex; gap: 10px; align-items: center;
  padding: 4px 0;
}
.timeline .step .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border);
}
.timeline .step.done .dot { background: var(--green); }
.timeline .step.current .dot { background: var(--yellow); }
.timeline .step .k { color: var(--text-dim); width: 110px; }
.timeline .step .v { color: var(--text); }

.sources {
  margin-top: 6px;
  font-size: 12px;
}
.sources a {
  display: block;
  color: var(--accent);
  text-decoration: none;
  padding: 4px 0;
  word-break: break-all;
}
.sources a:hover { text-decoration: underline; }

.footer-credit {
  position: absolute;
  bottom: 8px; left: 12px;
  font-size: 10px;
  color: var(--text-dim);
  z-index: 5;
}
.footer-credit a { color: var(--text-dim); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Datacenter<span class="accent">Map</span></div>
  <div class="kpi-strip">
    <div class="kpi"><span class="v" id="kpi-count">0</span><span class="l">sites</span></div>
    <div class="kpi"><span class="v" id="kpi-mw">0 MW</span><span class="l">total</span></div>
    <div class="kpi"><span class="v" id="kpi-construction">0</span><span class="l">under construction</span></div>
  </div>
  <input id="search" class="search-box" placeholder="Search operator, country, region…" />
</div>

<div class="filters">
  <div class="group">
    <h4>Status</h4>
    <div id="filter-statuses"></div>
  </div>
  <div class="group">
    <h4>Operator</h4>
    <div id="filter-operators"></div>
  </div>
</div>

<div id="globe-container"></div>

<aside class="detail-panel" id="detail-panel">
  <button class="close" id="close-detail" title="Close (Esc)">×</button>
  <div class="hero">(no photo yet)</div>
  <div class="body">
    <h2 class="dc-name">—</h2>
    <div class="subtitle dc-subtitle">—</div>

    <div class="section-title">Capacity</div>
    <div class="capacity-gauge"><div class="mw">—</div><div class="label">—</div></div>

    <div class="section-title">Build timeline</div>
    <div class="timeline"></div>

    <div class="section-title">Details</div>
    <div class="rows"></div>

    <div class="section-title">Sources</div>
    <div class="sources"></div>
  </div>
</aside>

<div class="footer-credit">
  Built with <a href="https://globe.gl" target="_blank" rel="noopener">Globe.gl</a> ·
  Data last refreshed 2026-05-11
</div>

<script>/* globe.js — interactive datacenter globe.
   Data is injected as window.__DC_DATA__ by the build step.
*/

const STATUS_COLOR = {
  operational: "#3fb950",
  under_construction: "#f0b429",
  planned: "#4cc2ff",
  retired: "#f85149",
};

const STATUS_LABEL = {
  operational: "Operational",
  under_construction: "Under construction",
  planned: "Planned",
  retired: "Retired",
};

const state = {
  data: window.__DC_DATA__ || [],
  filteredOperators: new Set(),
  filteredStatuses: new Set(["operational", "under_construction", "planned"]),
  search: "",
};

function visiblePoints() {
  const q = state.search.trim().toLowerCase();
  return state.data.filter(d => {
    if (state.filteredOperators.size && !state.filteredOperators.has(d.operator)) return false;
    if (!state.filteredStatuses.has(d.status)) return false;
    if (q) {
      const hay = `${d.name} ${d.operator} ${d.country || ""} ${d.region || ""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function updateKPIs() {
  const pts = visiblePoints();
  const total = pts.length;
  const totalMW = pts.reduce((s, d) => s + (d.capacity_mw || 0), 0);
  const construction = pts.filter(d => d.status === "under_construction").length;
  document.getElementById("kpi-count").textContent = total.toLocaleString();
  document.getElementById("kpi-mw").textContent = totalMW.toLocaleString() + " MW";
  const pct = total ? Math.round((construction / total) * 100) : 0;
  document.getElementById("kpi-construction").textContent = `${construction} (${pct}%)`;
}

function refreshGlobe() {
  globe.pointsData(visiblePoints());
  updateKPIs();
}

function fmtDate(s) {
  if (!s) return "—";
  try { return new Date(s).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
  catch { return s; }
}

function openDetail(dc) {
  const panel = document.getElementById("detail-panel");
  const hero = panel.querySelector(".hero");
  if (dc.primary_image_url) {
    hero.style.backgroundImage = `url("${dc.primary_image_url}")`;
    hero.textContent = "";
  } else if (dc.primary_image_local_path) {
    hero.style.backgroundImage = `url("${dc.primary_image_local_path}")`;
    hero.textContent = "";
  } else {
    hero.style.backgroundImage = "";
    hero.textContent = "(no photo yet)";
  }

  panel.querySelector(".dc-name").textContent = dc.name;
  panel.querySelector(".dc-subtitle").innerHTML =
    `${dc.operator} · ${dc.region || dc.country || "—"} ` +
    `<span class="badge ${dc.status}">${STATUS_LABEL[dc.status] || dc.status}</span>`;

  const rows = panel.querySelector(".rows");
  rows.innerHTML = "";
  const addRow = (k, v) => {
    if (v === null || v === undefined || v === "") return;
    const r = document.createElement("div");
    r.className = "row";
    r.innerHTML = `<span class="k">${k}</span><span class="v">${v}</span>`;
    rows.appendChild(r);
  };
  addRow("Operator", dc.operator);
  addRow("Location", [dc.region, dc.country].filter(Boolean).join(", "));
  addRow("Coordinates", `${dc.latitude.toFixed(3)}, ${dc.longitude.toFixed(3)}`);
  addRow("Confidence", dc.confidence || "—");

  // Capacity
  const gauge = panel.querySelector(".capacity-gauge");
  if (dc.capacity_mw) {
    gauge.style.display = "block";
    gauge.querySelector(".mw").textContent = `${dc.capacity_mw.toLocaleString()} MW`;
    gauge.querySelector(".label").textContent = dc.capacity_use || "Capacity";
  } else {
    gauge.style.display = "none";
  }

  // Timeline
  const tl = panel.querySelector(".timeline");
  tl.innerHTML = "";
  const isDone = (s) => dc.status === "operational" || dc.status === "retired" || s === "construction_start_date" || (dc.status === "under_construction" && s === "construction_start_date");
  const addStep = (k, dateField, current = false) => {
    const v = fmtDate(dc[dateField]);
    const cls = current ? "current" : (dc[dateField] ? "done" : "");
    tl.innerHTML += `<div class="step ${cls}"><span class="dot"></span><span class="k">${k}</span><span class="v">${v}</span></div>`;
  };
  addStep("Construction start", "construction_start_date");
  if (dc.status === "under_construction" || dc.status === "planned") {
    addStep("Expected completion", "expected_completion_date", true);
  } else {
    addStep("Completed", "actual_completion_date");
  }
  if (dc.build_duration_months) {
    tl.innerHTML += `<div class="step"><span class="dot"></span><span class="k">Build duration</span><span class="v">${dc.build_duration_months.toFixed(1)} months</span></div>`;
  }

  // Sources
  const sources = panel.querySelector(".sources");
  sources.innerHTML = "";
  let urls = [];
  try { urls = JSON.parse(dc.source_urls || "[]"); } catch {}
  if (Array.isArray(urls) && urls.length) {
    urls.forEach(u => {
      const a = document.createElement("a");
      a.href = u; a.target = "_blank"; a.rel = "noopener"; a.textContent = u;
      sources.appendChild(a);
    });
  } else {
    sources.innerHTML = `<span style="color:var(--text-dim)">No sources yet</span>`;
  }

  panel.classList.add("open");

  // Fly the camera to the point
  globe.pointOfView({ lat: dc.latitude, lng: dc.longitude, altitude: 1.5 }, 800);
}

function closeDetail() {
  document.getElementById("detail-panel").classList.remove("open");
}

// ---------- Globe setup ----------
const globe = Globe()
  (document.getElementById("globe-container"))
  .globeImageUrl("//unpkg.com/three-globe/example/img/earth-night.jpg")
  .bumpImageUrl("//unpkg.com/three-globe/example/img/earth-topology.png")
  .backgroundColor("#0a0e14")
  .pointAltitude(d => Math.max(0.01, Math.min(0.06, (d.capacity_mw || 100) / 40000)))
  .pointRadius(d => 0.25 + Math.min(0.6, (d.capacity_mw || 100) / 4000))
  .pointColor(d => STATUS_COLOR[d.status] || "#888")
  .pointLabel(d => `
    <div style="background:#11161f;border:1px solid #232a37;padding:8px 10px;border-radius:6px;font-family:sans-serif;font-size:12px;color:#e6edf3;max-width:260px">
      <div style="font-weight:600;margin-bottom:2px">${d.name}</div>
      <div style="color:#8b97a8">${d.operator} · ${STATUS_LABEL[d.status] || d.status}</div>
      ${d.capacity_mw ? `<div style="color:#4cc2ff;margin-top:4px">${d.capacity_mw.toLocaleString()} MW</div>` : ""}
    </div>
  `)
  .onPointClick(d => openDetail(d))
  .atmosphereColor("#4cc2ff")
  .atmosphereAltitude(0.15);

// Auto-rotate gently until first user interaction
globe.controls().autoRotate = true;
globe.controls().autoRotateSpeed = 0.35;
document.getElementById("globe-container").addEventListener("mousedown", () => {
  globe.controls().autoRotate = false;
}, { once: true });

// ---------- Filter UI ----------
function buildFilters() {
  const operators = [...new Set(state.data.map(d => d.operator))].sort();
  const opBox = document.getElementById("filter-operators");
  opBox.innerHTML = "";
  operators.forEach(op => {
    const id = `op-${op.replace(/\s+/g, "-")}`;
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" id="${id}" checked /><span>${op}</span>`;
    opBox.appendChild(label);
    label.querySelector("input").addEventListener("change", e => {
      if (e.target.checked) state.filteredOperators.delete(op);
      else state.filteredOperators.add(op);
      // We invert: an empty set means "all operators"
      // Rebuild as: keep set of allowed operators
      const allowed = operators.filter(o => document.getElementById(`op-${o.replace(/\s+/g, "-")}`).checked);
      state.filteredOperators = new Set(allowed.length === operators.length ? [] : allowed);
      refreshGlobe();
    });
  });

  const statuses = ["operational", "under_construction", "planned"];
  const stBox = document.getElementById("filter-statuses");
  stBox.innerHTML = "";
  statuses.forEach(st => {
    const id = `st-${st}`;
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" id="${id}" checked />
      <span class="dot" style="background:${STATUS_COLOR[st]}"></span>
      <span>${STATUS_LABEL[st]}</span>`;
    stBox.appendChild(label);
    label.querySelector("input").addEventListener("change", e => {
      if (e.target.checked) state.filteredStatuses.add(st);
      else state.filteredStatuses.delete(st);
      refreshGlobe();
    });
  });
}

document.getElementById("search").addEventListener("input", e => {
  state.search = e.target.value;
  refreshGlobe();
});

document.getElementById("close-detail").addEventListener("click", closeDetail);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

// Init
buildFilters();
refreshGlobe();
</script>
